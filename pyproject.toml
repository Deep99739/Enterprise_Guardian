[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise_guardian"
version = "1.0.0"
description = "Corporate Finance Approver Environment for OpenEnv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git@v0.2.1",
    "fastapi",
    "pydantic"
]

[project.optional-dependencies]
server = ["uvicorn"]
